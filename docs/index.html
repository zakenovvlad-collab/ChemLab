<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChemLab</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- ШАПКА -->
        <header class="header">
            <h1>🧪 ChemLab</h1>
        </header>

        <!-- НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchView('lab')" id="nav-lab">
                <span class="icon">⚗️</span>
                <span>Колба</span>
            </button>
            <button class="nav-item" onclick="switchView('elements')" id="nav-elements">
                <span class="icon">⚛️</span>
                <span>Реагенты</span>
            </button>
            <button class="nav-item" onclick="switchView('info')" id="nav-info">
                <span class="icon">📖</span>
                <span>Инфо</span>
            </button>
        </nav>

        <!-- ЭКРАН 1: ЛАБОРАТОРИЯ -->
        <main id="view-lab" class="view active-view">
            <div class="flask-area">
                <div class="flask">
                    <div class="flask-neck"></div>
                    <div class="flask-body">
                        <div id="liquid" class="liquid"></div>
                        <div id="bubbles" class="bubbles"></div>
                    </div>
                </div>
            </div>
            
            <div class="status-panel">
                <h3 id="reaction-title">Пустая колба</h3>
                <p id="reaction-desc">Добавьте два компонента для реакции.</p>
                <button id="reset-btn" class="action-btn clear">Очистить 🗑️</button>
            </div>
        </main>

        <!-- ЭКРАН 2: СЕТКА ЭЛЕМЕНТОВ (ВМЕСТО ТАБЛИЦЫ) -->
        <main id="view-elements" class="view">
            <div class="grid-container" id="elements-grid">
                <!-- Карточки генерируются через JS -->
            </div>
        </main>

        <!-- ЭКРАН 3: ИНФО О ВЕЩЕСТВЕ (ВЫЕЗЖАЕТ КАРТОЧКА) -->
        <main id="view-info" class="view">
            <button class="back-btn" onclick="switchView('elements')">← Назад к реагентам</button>
            
            <div id="info-card" class="info-card">
                <div class="info-header">
                    <div id="info-symbol" class="info-symbol">H</div>
                    <div>
                        <h2 id="info-name">Водород</h2>
                        <p id="info-type">Неметалл</p>
                    </div>
                </div>
                <div class="info-body">
                    <p id="info-desc">Описание элемента...</p>
                    
                    <h4 style="margin-top: 15px; margin-bottom: 5px;">Взаимодействует с:</h4>
                    <div id="info-reacts" class="tags-container"></div>
                </div>
                <button id="add-to-flask-btn" class="action-btn add">➕ В колбу</button>
            </div>
        </main>

    </div>
    
    <script src="app.js"></script>
</body>
</html>
