<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChemLab PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-lab">
                <span class="icon">⚗️</span><span>Колба</span>
            </button>
            <button class="nav-item" id="nav-elements">
                <span class="icon">⚛️</span><span>База</span>
            </button>
            <button class="nav-item" id="nav-info">
                <span class="icon">📖</span><span>Книга</span>
            </button>
        </nav>

        <div class="main-content">
            <header class="header">
                <h1>🧪 ChemLab <span style="font-size: 10px; color: #3498db; vertical-align: super;">PRO</span></h1>
            </header>

            <!-- Экран 1: Лаборатория -->
            <main id="view-lab" class="view active-view">
                <div class="flask-area">
                    <div class="flask">
                        <div class="flask-neck"></div>
                        <div class="flask-body">
                            <div id="precipitate" class="precipitate"></div>
                            <div id="liquid" class="liquid"></div>
                            <div id="bubbles" class="bubbles"></div>
                        </div>
                    </div>
                </div>
                <div class="status-panel">
                    <h3 id="reaction-title">Пустая колба</h3>
                    <p id="reaction-desc">Добавьте два компонента для реакции.</p>
                    <button id="reset-btn" class="action-btn clear">Очистить 🗑️</button>
                </div>
            </main>

            <!-- Экран 2: База элементов -->
            <main id="view-elements" class="view">
                <input type="text" id="search-input" class="search-bar" placeholder="🔍 Поиск элемента...">
                <div class="grid-container" id="elements-grid"></div>
            </main>

            <!-- Экран 3: КНИГА (Инфо) -->
            <main id="view-info" class="view">
                
                <!-- Оглавление -->
                <div id="book-toc" class="book-toc">
                    <h2>📖 Химическая энциклопедия</h2>
                    <p style="color: var(--hint); font-size: 13px; margin-bottom: 15px;">Выберите вещество для чтения</p>
                    <div id="toc-list" class="toc-list"></div>
                </div>

                <!-- Страница книги -->
                <div id="info-card" class="book-page" style="display: none;">
                    <button class="back-btn" id="back-to-toc">← К оглавлению</button>
                    
                    <div class="book-header">
                        <div id="info-symbol" class="info-symbol">H</div>
                        <div>
                            <h2 id="info-name">Водород</h2>
                            <p id="info-type" class="book-type">Неметалл</p>
                        </div>
                    </div>
                    
                    <div class="book-content">
                        <p id="info-desc" class="book-desc">Описание...</p>
                        <h4 style="margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Взаимодействует с:</h4>
                        <div id="info-reacts" class="tags-container"></div>
                    </div>

                    <div class="book-footer">
                        <button id="prev-page" class="page-btn">← Пред.</button>
                        <span id="page-num" class="page-num">1</span>
                        <button id="next-page" class="page-btn">След. →</button>
                    </div>

                    <button id="add-to-flask-btn" class="action-btn add" style="margin-top: 10px;">➕ Залить в колбу</button>
                </div>

            </main>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
