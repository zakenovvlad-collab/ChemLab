<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChemLab PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>🧪 ChemLab <span style="font-size: 10px; color: #3498db; vertical-align: super;">PRO</span></h1>
        </header>

        <main id="view-lab" class="view active-view">
            <div class="flask-area">
                <div class="flask">
                    <div class="flask-neck"></div>
                    <div class="flask-body">
                        <div id="precipitate" class="precipitate"></div>
                        <div id="liquid" class="liquid"></div>
                        <div id="bubbles" class="bubbles"></div>
                    </div>
                </div>
            </div>
            <div class="status-panel">
                <h3 id="reaction-title">Пустая колба</h3>
                <p id="reaction-desc">Добавьте два компонента для реакции.</p>
                <button id="reset-btn" class="action-btn clear">Очистить 🗑️</button>
            </div>
        </main>

        <main id="view-elements" class="view">
            <input type="text" id="search-input" class="search-bar" placeholder="🔍 Поиск элемента...">
            <div class="categories" id="categories-container">
                <button class="cat-btn active" data-cat="all">Все</button>
                <button class="cat-btn" data-cat="metal">Металлы</button>
                <button class="cat-btn" data-cat="nonmetal">Неметаллы</button>
                <button class="cat-btn" data-cat="acid">Кислоты</button>
                <button class="cat-btn" data-cat="base">Щелочи</button>
                <button class="cat-btn" data-cat="salt">Соли</button>
            </div>
            <div class="grid-container" id="elements-grid"></div>
        </main>

        <main id="view-info" class="view">
            <button class="back-btn" id="back-btn">← Назад к базе</button>
            <div id="info-card" class="info-card">
                <div class="info-header">
                    <div id="info-symbol" class="info-symbol">H</div>
                    <div>
                        <h2 id="info-name">Водород</h2>
                        <p id="info-type">Неметалл</p>
                    </div>
                </div>
                <div class="info-body">
                    <p id="info-desc">Описание...</p>
                    <h4 style="margin-top: 15px; margin-bottom: 5px;">Реагирует с:</h4>
                    <div id="info-reacts" class="tags-container"></div>
                </div>
                <button id="add-to-flask-btn" class="action-btn add">➕ Залить в колбу</button>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-lab">
                <span class="icon">⚗️</span><span>Колба</span>
            </button>
            <button class="nav-item" id="nav-elements">
                <span class="icon">⚛️</span><span>База</span>
            </button>
            <button class="nav-item" id="nav-info">
                <span class="icon">📖</span><span>Инфо</span>
            </button>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
