<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChemLab - Лаборатория</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h2>🧪 Химическая лаборатория</h2>
        </header>

        <!-- Зона с колбой -->
        <div class="lab-area">
            <div class="flask-wrapper">
                <div class="flask">
                    <div class="flask-neck"></div>
                    <div class="flask-body">
                        <!-- Жидкость внутри колбы -->
                        <div id="liquid" class="liquid"></div>
                        <!-- Слой для пузырьков -->
                        <div id="bubbles" class="bubbles"></div>
                    </div>
                </div>
            </div>
            
            <!-- Текстовое поле для результата реакции -->
            <div id="reaction-text" class="reaction-text">Добавь реагенты...</div>
        </div>

        <!-- Панель с реагентами -->
        <div class="controls">
            <button class="chem-btn" data-chem="water" style="--color: #3498db">💧 Вода (H₂O)</button>
            <button class="chem-btn" data-chem="acid" style="--color: #e74c3c">🧪 Кислота (H₂SO₄)</button>
            <button class="chem-btn" data-chem="base" style="--color: #9b59b6">🧼 Щелочь (NaOH)</button>
            <button class="chem-btn" data-chem="metal" style="--color: #bdc3c7">🔩 Металл (Na)</button>
        </div>

        <button id="reset-btn" class="reset-btn">Очистить колбу 🗑️</button>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
